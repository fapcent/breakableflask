name: Automatisation des tests DevSecOps
on: push

permissions:
  contents: read

jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v6.0.2

      - name: Scanner requirements.txt avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DETECTION_PRIORITY: comprehensive
        with:
          scan-type: fs
          scan-ref: requirements.txt
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

  Dockerfile:
    needs: Dependances
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v6.0.2

      - name: Scanner le Dockerfile avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Construire l'image Docker
        run: docker build -t breakableflask:ci .

      - name: Vérifier le build (test du conteneur)
        run: |
          docker image inspect breakableflask:ci > /dev/null
          docker run -d -p 4000:4000 --name test-app breakableflask:ci
          sleep 5
          STATUS=$(docker inspect -f '{{.State.Running}}' test-app)
          if [ "$STATUS" != "true" ]; then
            echo "Échec : le conteneur ne tourne pas"
            docker logs test-app
            docker rm -f test-app
            exit 1
          fi
          if ! curl -s -o /dev/null -w "Code HTTP reçu : %{http_code}\n" http://127.0.0.1:4000/; then
            echo "Échec : l'application ne répond pas sur le port 4000"
            docker logs test-app
            docker rm -f test-app
            exit 1
          fi
          docker rm -f test-app

      - name: Scanner l'image Docker avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: breakableflask:ci
          scanners: vuln
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'

  Deploy:
    needs: Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: echo "Votre application est prête à être déployée"
