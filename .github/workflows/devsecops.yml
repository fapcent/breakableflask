name: Automatisation des tests DevSecOps
on: push

jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Scanner les dépendances avec Trivy
        run: |
          docker run --rm \
            -v "$PWD":/project \
            aquasec/trivy:latest fs --exit-code 1 --severity HIGH,CRITICAL /project/requirements.txt

  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Scanner le Dockerfile avec Trivy
        run: |
          docker run --rm \
            -v "$PWD":/project \
            aquasec/trivy:latest config --exit-code 1 --severity HIGH,CRITICAL /project/Dockerfile

      - name: Construire l'image Docker
        run: |
          docker build -t imgsec:1.0 .

      - name: Vérifier le build (test du conteneur)
        run: |
          docker image inspect imgsec:1.0 > /dev/null
          docker run -d -p 4000:4000 --name test-app imgsec:1.0
          sleep 5
          STATUS=$(docker inspect -f '{{.State.Running}}' test-app)
          if [ "$STATUS" != "true" ]; then
            echo "Échec : le conteneur s'est arrêté"
            docker logs test-app
            docker rm -f test-app
            exit 1
          fi
          if ! curl -s -o /dev/null -w "Code HTTP reçu : %{http_code}\n" http://localhost:4000; then
            echo "Échec : le serveur ne répond pas sur le port 4000"
            docker logs test-app
            docker rm -f test-app
            exit 1
          fi
          docker rm -f test-app

      - name: Scanner l'image Docker avec Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --exit-code 1 --pkg-types library --severity HIGH,CRITICAL imgsec:1.0

  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "Rien à faire ici. Votre application est prête à être déployée"
