name: Automatisation des tests DevSecOps
on: push

jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Scanner les dépendances avec Trivy
        run: |
          docker run --rm \
            -v "$PWD":/project \
            aquasec/trivy:latest fs --exit-code 1 --severity HIGH,CRITICAL /project/requirements.txt

  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Scanner le Dockerfile avec Trivy
        run: |
          docker run --rm \
            -v "$PWD":/project \
            aquasec/trivy:latest config --exit-code 1 --severity HIGH,CRITICAL /project/Dockerfile

      - name: Construire l'image Docker
        run: |
          docker build -t imgsec:1.0 .

  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "Rien à faire ici. Votre application est prête à être déployée"
