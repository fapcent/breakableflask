name: Automatisation des tests DevSecOps
on: push

jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Scan des dépendances (requirements.txt) avec Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1

  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Contrôle du Dockerfile avec Trivy (misconfiguration)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Construction de l'image Docker
        run: docker build -t breakableflask:latest .

      - name: Scanner l'image Docker avec Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: breakableflask:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "Rien à faire ici. Votre application est prête à être déployée"
